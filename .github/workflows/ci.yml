# Builds the engine, runs the tests that need no GPU and packs the packages: for every pull request, and for master
# once it is merged into. On Windows, on Linux and on macOS (ARM64): the effects generator compiles the built-in shaders
# during the build on each, and a path or a file name that only Windows forgives fails on Linux before it is merged.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A required check for master: the job always runs and always reports, so a pull request is never left waiting for a
  # check that did not start. What it skips is the work, when nothing but documents, icons or settings changed.
  #
  # Windows keeps the job's name, build - the one master requires; Linux and macOS run beside it as build (linux)
  # and build (macos).
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A hung run is stopped long before GitHub's six hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: build
          - os: ubuntu-latest
            name: build (linux)
          - os: macos-latest
            name: build (macos)

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A list of what to skip rather than of what to build, so a new project folder is built without anyone adding it.
      # With nothing to compare against - a manual run, a history that is not there - everything counts as code.
      - name: Changes
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          code=true
          range=
          case "$EVENT" in
            pull_request) range="$BASE...$HEAD" ;;
            push) if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$SHA"; fi ;;
          esac
          if [ -n "$range" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                ""|*.md|LICENSE|NOTICE|*icon.png|.gitignore|*.DotSettings|.github/workflows/publish-nuget.yml) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only "$range")
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

      # Where Directory.Build.props looks for it: a binding change is built here once it is merged into master, with no
      # package published for it.
      - name: AdamantiumVulkan
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/AdamantiumStudio/AdamantiumVulkan.git ../AdamantiumVulkan
          git -C ../AdamantiumVulkan log -1 --format='AdamantiumVulkan at %h: %s'

      # QuantumBinding beside it too, for the Utils the bindings call and the binding generator.
      - name: QuantumBinding
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/AdamantiumStudio/QuantumBinding.git ../QuantumBinding
          git -C ../QuantumBinding log -1 --format='QuantumBinding at %h: %s'

      # Version comes from global.json, so CI and a developer's machine build with the same SDK.
      - uses: actions/setup-dotnet@v6
        if: steps.changes.outputs.code == 'true'
        with:
          global-json-file: global.json

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: dotnet build AdamantiumEngine.sln -c Release -warnaserror

      # The runners have no GPU. Adamantium.Engine.GraphicsTests and Adamantium.UniverseHost.Tests create a Vulkan device, so
      # they are left out; every other test runs without one.
      #
      # The suites run at once, each in a process of its own: they share nothing, and one after another the run took
      # the sum of them all. Built first, because several builds at once would write the same engine projects. The tests
      # inside a suite stay sequential.
      - name: Test
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          dotnet build AdamantiumEngine.Tests.sln -c Release
          pids=()
          logs=()
          for p in Tests/*/*.csproj; do
            case "$p" in *GraphicsTests*|*UniverseHost.Tests*) continue ;; esac
            log="$RUNNER_TEMP/$(basename "$p" .csproj).log"
            # A test that hangs is stopped after 10 minutes; the blame sequence, uploaded below, says which it was.
            dotnet test "$p" -c Release --no-build --blame-hang-timeout 10m --blame-hang-dump-type none > "$log" 2>&1 &
            pids+=($!)
            logs+=("$log")
          done
          # The physics' allocation tests again with the JIT's optimizations off, where allocations it removes show.
          log="$RUNNER_TEMP/DarkMatterAllocationsMinOpts.log"
          DOTNET_JITMinOpts=1 dotnet test Tests/Adamantium.DarkMatter.Tests/Adamantium.DarkMatter.Tests.csproj -c Release \
            --no-build --filter "FullyQualifiedName~AllocationTests" \
            --results-directory "$RUNNER_TEMP/DarkMatterAllocationsMinOpts" > "$log" 2>&1 &
          pids+=($!)
          logs+=("$log")
          status=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || status=1
            cat "${logs[$i]}"
          done
          exit $status

      - name: Blame sequences of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blame-${{ matrix.name }}
          path: Tests/*/TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

      # Once: the packages are the same whichever runner packs them.
      - name: Pack
        if: steps.changes.outputs.code == 'true' && matrix.os == 'windows-latest'
        run: dotnet pack AdamantiumEngine.sln -c Release --no-build -o artifacts/nupkg

  # The maths on ARM64 - Apple Silicon - without SIMD: build (macos) runs them with it, 128-bit NEON and the double
  # matrices' two-half path, which the x64 runners only imitate, and the two paths must give the same answers. Not a
  # check master requires.
  maths-arm64:
    name: maths (macos arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Processor
        run: |
          uname -m
          dotnet --info | grep -E "RID|Architecture"

      - name: Build
        run: dotnet build Tests/Adamantium.MathTests/Adamantium.MathTests.csproj -c Release -warnaserror

      - name: Test without SIMD
        env:
          DOTNET_EnableHWIntrinsic: 0
        run: dotnet test Tests/Adamantium.MathTests/Adamantium.MathTests.csproj -c Release --no-build
