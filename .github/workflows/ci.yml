# Builds the engine, runs the tests that need no GPU and packs the packages: for every pull request, and for master
# once it is merged into. On Windows and on Linux: the effects generator compiles the built-in shaders during the build
# on either, and a path or a file name that only Windows forgives fails on Linux before it is merged.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A required check for master: the job always runs and always reports, so a pull request is never left waiting for a
  # check that did not start. What it skips is the work, when nothing but documents, icons or settings changed.
  #
  # Windows keeps the job's name, build - the one master requires; Linux runs beside it as build (linux).
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: build
          - os: ubuntu-latest
            name: build (linux)

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A list of what to skip rather than of what to build, so a new project folder is built without anyone adding it.
      # With nothing to compare against - a manual run, a history that is not there - everything counts as code.
      - name: Changes
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          code=true
          range=
          case "$EVENT" in
            pull_request) range="$BASE...$HEAD" ;;
            push) if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$SHA"; fi ;;
          esac
          if [ -n "$range" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                ""|*.md|LICENSE|NOTICE|*icon.png|.gitignore|*.DotSettings|.github/workflows/publish-nuget.yml) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only "$range")
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

      # Version comes from global.json, so CI and a developer's machine build with the same SDK.
      - uses: actions/setup-dotnet@v6
        if: steps.changes.outputs.code == 'true'
        with:
          global-json-file: global.json

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: dotnet build AdamantiumEngine.sln -c Release -warnaserror

      # The runners have no GPU. Adamantium.Engine.GraphicsTests is the one project that creates a Vulkan device, so it
      # is left out; every other test runs without one.
      #
      # The suites run at once, each in a process of its own: they share nothing, and one after another the run took
      # the sum of them all. Built first, because several builds at once would write the same engine projects. The tests
      # inside a suite stay sequential.
      - name: Test
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          dotnet build AdamantiumEngine.Tests.sln -c Release
          pids=()
          logs=()
          for p in Tests/*/*.csproj; do
            case "$p" in *GraphicsTests*) continue ;; esac
            log="$RUNNER_TEMP/$(basename "$p" .csproj).log"
            dotnet test "$p" -c Release --no-build > "$log" 2>&1 &
            pids+=($!)
            logs+=("$log")
          done
          status=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || status=1
            cat "${logs[$i]}"
          done
          exit $status

      # Once: the packages are the same whichever runner packs them.
      - name: Pack
        if: steps.changes.outputs.code == 'true' && matrix.os == 'windows-latest'
        run: dotnet pack AdamantiumEngine.sln -c Release --no-build -o artifacts/nupkg
